name: Build Android APK

on:
  workflow_dispatch:    # Manual trigger from GitHub UI
  push:
    tags:
      - 'v*'           # Auto-build on version tags like v1.0.0

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check Supabase secrets are set
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::Repository secret VITE_SUPABASE_URL is not set"; missing=1; }
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is not set"; missing=1; }
          exit $missing

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_IS_WHITE_LABEL: ${{ vars.VITE_IS_WHITE_LABEL }}
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-buddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
