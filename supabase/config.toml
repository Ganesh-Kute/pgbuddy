project_id = "vcpohetbsyyjqqkzuzxj"

# Cron-only: authenticated in-function via CRON_SECRET or SUPABASE_SERVICE_ROLE_KEY
[functions.rent-reminders]
verify_jwt = false

[functions.push-notifications]
verify_jwt = true

[functions.twilio-notifications]
verify_jwt = true

# Webhook-authenticated via x-razorpay-signature HMAC-SHA256
[functions.razorpay-webhook]
verify_jwt = false

# Pre-login Supabase Auth Send SMS Hook. The version here is the one running in production (v116):
# it does NOT verify the hook's Standard Webhooks signature yet. Signature checking needs the
# SEND_SMS_HOOK_SECRET secret, which the project does not have; add it before deploying a version that requires it.
[functions.send-sms-otp]
enabled = true
verify_jwt = false
import_map = "./functions/send-sms-otp/deno.json"
entrypoint = "./functions/send-sms-otp/index.ts"
